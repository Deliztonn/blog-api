
spring.application.name=blog-api

# ==========================================
# MySQL
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/blogappdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate / Flyway
# ==========================================

# O Flyway gerencia a criacao e alteracao das tabelas
# O Hibernate apenas valida a estrutura do banco
spring.jpa.hibernate.ddl-auto=validate

# Mostrar consultas SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# ==========================================
# Swagger / OpenAPI
# ==========================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# Flyway
# ==========================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true


# ==========================================
# Jackson
# ==========================================

spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.default-property-inclusion=non_null

# ==========================================
# Encoding
# ==========================================

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true